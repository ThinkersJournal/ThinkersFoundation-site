name: CI

# Four HARD gates, one job each, so each job name can be a required check on its own.
# A job that dies in an early step asserts nothing about the steps below it while its
# name goes on claiming otherwise. Separate jobs keep each name answering for one gate.
#
#   1. Tree-freshness guard  -- tests/freshness.spec.ts: the guard's decision table plus
#                               an end-to-end run against a real squash-merged repository
#   2. Type check            -- `astro check`
#   3. Build                 -- `astro build`, the same build Cloudflare Pages runs
#   4. Playwright + axe      -- the full suite against `astro preview` of the built site
#
# WHY (1) RUNS THE GUARD'S TESTS AND NOT THE GUARD. `scripts/check-tree-freshness.mjs`
# guards a developer's LOCAL tree. A CI checkout of a pull_request is a detached merge
# commit, so the guard prints "NOT VERIFIED -- HEAD is detached" and exits 0. That
# step would be green on every PR whatever the guard's code said. What CI can check is
# that the guard still makes the right decision, and its own spec does that.
#
# RUNNER (pull requests). Every job runs on GitHub-hosted ubuntu-latest (CireSnave 2026-10-22: prefer hosted
# runners for public repos wherever a job needs no GPU; no job here needs Windows). This repo is public and
# no self-hosted runner is registered for it. No secrets in any job; the same-repo `if:` on the pull_request
# jobs keeps fork code off the workflow. Keep ci-pr.yml and ci-main.yml jobs identical apart from that line.
#
# Cloudflare Pages deploys on its own. A deploy status is not a gate, so nothing here
# deploys and none of these jobs depend on it.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Tree-freshness guard
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No browser is needed: this spec drives git and the guard's exported functions.
      # Playwright's webServer still builds and previews the site first, as the config
      # requires.
      - name: Guard decision + end-to-end fixture (tests/freshness.spec.ts)
        run: npx playwright test tests/freshness.spec.ts

  check:
    name: Type check (astro check)
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: astro check
        run: npm run check

  build:
    name: Build (astro build)
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: astro build
        run: npm run build

  test:
    name: Playwright + axe
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hosted Linux runners start without Chromium's OS libraries, so --with-deps installs them.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `npx playwright test`, not `npm test`: the pretest hook runs the freshness guard,
      # which is "NOT VERIFIED" on a detached CI checkout (see the header). Job 1 covers
      # the guard.
      - name: Playwright suite, including axe accessibility checks
        run: npx playwright test

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ADVISORY, not a required check (CireSnave 2026-10-23: "Roll out advisory-only, non-blocking
  # CodeRipper checks everywhere."). Pull requests only, so it has no twin in ci-main.yml. The
  # reusable workflow is pinned to a commit of ciresnave/coderipper (public); it runs on the
  # reusable workflow's default, ubuntu-latest (this repo is public). Do not add it to branch protection.
  portfolio:
    name: Portfolio checks (advisory)
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@467fd259d6d062cba4c5683d310f1a6f2b66e763 # 0.48.1
