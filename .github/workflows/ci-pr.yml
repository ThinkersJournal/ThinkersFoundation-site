name: CI

# Four HARD gates, one job each, so each job name can be a required check on its own.
# A job that dies in an early step asserts nothing about the steps below it while its
# name goes on claiming otherwise. Separate jobs keep each name answering for one gate.
#
#   1. Tree-freshness guard  -- tests/freshness.spec.ts: the guard's decision table plus
#                               an end-to-end run against a real squash-merged repository
#   2. Type check            -- `astro check`
#   3. Build                 -- `astro build`, the same build Cloudflare Pages runs
#   4. Playwright + axe      -- the full suite against `astro preview` of the built site
#
# WHY (1) RUNS THE GUARD'S TESTS AND NOT THE GUARD. `scripts/check-tree-freshness.mjs`
# guards a developer's LOCAL tree. A CI checkout of a pull_request is a detached merge
# commit, so the guard prints "NOT VERIFIED -- HEAD is detached" and exits 0. That
# step would be green on every PR whatever the guard's code said. What CI can check is
# that the guard still makes the right decision, and its own spec does that.
#
# RUNNER (pull requests). Hosted Actions on this private repo die in 2 s on an account billing
# failure, so every job runs on the self-hosted Windows runner (EXPECTATIONS 5.1h, "Private
# repos"; agentlife docs/RUNNER-SETUP.md 2b/8a). This file is pull_request ONLY and every job
# carries the same-repo `if:`, as the lint requires; push/dispatch live in ci-main.yml with
# the same jobs and no `if:`. Keep the two files' jobs identical apart from that line.
# A private repo takes no fork PRs and its fork-workflow setting stays off; the `if:` keeps
# it that way if that ever changes. No environment gate (Free plan). No secrets.
# Not measured: nothing here has run on `gh-runner` yet (no runner is registered).
#
# Cloudflare Pages deploys on its own. A deploy status is not a gate, so nothing here
# deploys and none of these jobs depend on it.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Tree-freshness guard
    runs-on: [self-hosted, windows]
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No browser is needed: this spec drives git and the guard's exported functions.
      # Playwright's webServer still builds and previews the site first, as the config
      # requires.
      - name: Guard decision + end-to-end fixture (tests/freshness.spec.ts)
        run: npx playwright test tests/freshness.spec.ts

  check:
    name: Type check (astro check)
    runs-on: [self-hosted, windows]
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: astro check
        run: npm run check

  build:
    name: Build (astro build)
    runs-on: [self-hosted, windows]
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: astro build
        run: npm run build

  test:
    name: Playwright + axe
    runs-on: [self-hosted, windows]
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium lands in the runner account's Playwright cache and is reused across jobs;
      # the install is a no-op when the pinned version is already there. No --with-deps:
      # that flag installs Linux OS packages and this runner is Windows.
      - name: Install Chromium
        run: npx playwright install chromium

      # `npx playwright test`, not `npm test`: the pretest hook runs the freshness guard,
      # which is "NOT VERIFIED" on a detached CI checkout (see the header). Job 1 covers
      # the guard.
      - name: Playwright suite, including axe accessibility checks
        run: npx playwright test

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ADVISORY, not a required check (CireSnave 2026-10-23: "Roll out advisory-only, non-blocking
  # CodeRipper checks everywhere."). Pull requests only, so it has no twin in ci-main.yml. The
  # reusable workflow is pinned to a commit of ciresnave/coderipper (public); `runs-on` is the
  # self-hosted label because this repo is private. Do not add it to branch protection.
  portfolio:
    name: Portfolio checks (advisory)
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@30e012b7d400b10d88c1e294bd485e49975afc1e
    with:
      runs-on: self-hosted
